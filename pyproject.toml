[project]
name = "capability-marketplace"
version = "0.1.0"
description = "Minimal multi-tenant capability marketplace runtime on Google ADK"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "aiosqlite>=0.20",
    "cryptography>=43.0",
]

[project.optional-dependencies]
adk = ["google-adk>=2.12.0"]
litellm = ["google-adk[extensions,mcp]>=2.12.0"]
openapi-mcp = ["fastmcp>=2.0"]
notifications = ["composio>=0.7"]
mongo = [
    "motor>=3.5",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
